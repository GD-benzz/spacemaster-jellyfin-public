# 您的 Jellyfin 服务在 compose 里须叫 "jellyfin"（不叫就改下面两处的 jellyfin）。

services:
  jellyfin:
    entrypoint: ["/opt/sm/setup.sh"]
    volumes:
      - sm-data:/opt/sm
    depends_on:
      - sm-console

  sm-console:
    image: ghcr.io/gd-benzz/spacemaster-fnos:v3
    container_name: spacemaster-console
    ports:
      - "8777:8777"
    volumes:
      - sm-data:/opt/sm
    command: ["python3", "/opt/sm/peq_toggle_nas.py"]
    restart: unless-stopped

  sm-proxy:
    image: ghcr.io/gd-benzz/spacemaster-fnos:v3
    container_name: spacemaster-proxy
    ports:
      - "8097:8097"
    environment:
      - UPSTREAM=http://jellyfin:8096
      - LISTEN_PORT=8097
      - STRIP_AUDIO=aac,aac_latm,mp3
    volumes:
      - sm-data:/opt/sm
    command: ["python3", "/opt/sm/profile-proxy.py"]
    restart: unless-stopped
    depends_on:
      - sm-console

volumes:
  sm-data:
